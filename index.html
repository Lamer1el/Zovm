<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Загрузка...</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    cursor: none !important;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    position: fixed;
  }
  #video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    z-index: 9999;
    background: #000;
  }
  #overlay {
    position: fixed;
    inset: 0;
    z-index: 10000;
    background: transparent;
  }
</style>
</head>
<body>
<video id="video" src="obormot.mp4" playsinline webkit-playsinline></video>
<div id="overlay"></div>

<script>
(function () {
  const video = document.getElementById('video');
  const overlay = document.getElementById('overlay');

  // Максимальная громкость
  video.volume = 1.0;
  video.muted = false;
  video.loop = true;
  video.controls = false;
  video.disablePictureInPicture = true;

  // Попытка сразу запустить
  function forcePlay() {
    video.muted = false;
    video.volume = 1.0;
    const p = video.play();
    if (p !== undefined) {
      p.catch(() => {
        // Браузер блокирует — ждём любого клика/тапа
        const unlock = () => {
          video.muted = false;
          video.volume = 1.0;
          video.play();
          document.removeEventListener('click', unlock);
          document.removeEventListener('touchstart', unlock);
          document.removeEventListener('keydown', unlock);
        };
        document.addEventListener('click', unlock, { once: true });
        document.addEventListener('touchstart', unlock, { once: true });
        document.addEventListener('keydown', unlock, { once: true });
      });
    }
  }

  // Fullscreen
  function goFullscreen() {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else if (el.msRequestFullscreen) el.msRequestFullscreen();
  }

  // Блокируем выход
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) {
      setTimeout(goFullscreen, 50);
    }
  });

  // Блокируем клавиши (Esc, F11, Alt+F4 и т.д.)
  window.addEventListener('keydown', e => {
    e.preventDefault();
    e.stopPropagation();
    return false;
  }, true);

  window.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('selectstart', e => e.preventDefault());

  // При любом движении мыши/тапе — снова fullscreen + play
  ['click', 'touchstart', 'mousemove', 'keydown'].forEach(evt => {
    document.addEventListener(evt, () => {
      goFullscreen();
      forcePlay();
    }, { passive: false });
  });

  // Старт
  forcePlay();
  goFullscreen();

  // На всякий случай через 300 мс ещё раз
  setTimeout(() => {
    forcePlay();
    goFullscreen();
  }, 300);

  // Если вкладку пытаются свернуть — возвращаем фокус
  window.addEventListener('blur', () => {
    window.focus();
    forcePlay();
  });

  // Бесконечный цикл проверки
  setInterval(() => {
    if (video.paused) forcePlay();
    if (!document.fullscreenElement) goFullscreen();
    video.volume = 1.0;
    video.muted = false;
  }, 400);
})();
</script>
</body>
</html>
